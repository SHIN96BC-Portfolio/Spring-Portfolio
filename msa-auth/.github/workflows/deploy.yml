name: Deploy auth-service

on:
  push:
    branches: [main]
    paths:
      - 'auth-service/**'
      - 'libs/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Build
        run: ./gradlew :auth-service:bootJar
      
      # TODO: Docker build + push + deploy
