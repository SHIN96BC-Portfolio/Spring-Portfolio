version: '3.9'

# ===================================================================
# msa-infra - 공유 인프라
# 
# Kafka, Redis, 관찰 가능성 스택
# msa-auth와 msa-platform이 이 인프라를 사용합니다.
# ===================================================================

services:
  # ========== Kafka (KRaft 모드) ==========
  kafka:
    image: apache/kafka:3.6.0
    container_name: msa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - msa-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # ========== Kafka UI (개발 편의) ==========
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: msa-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - msa-network

  # ========== Kafka 토픽 자동 생성 ==========
  kafka-init:
    image: apache/kafka:3.6.0
    container_name: msa-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: |
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic auth.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic user.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic commerce.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic fashion.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic social.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic point.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic recommendation.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic notification.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic media.events --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic saga.commands --partitions 3 --replication-factor 1 --if-not-exists
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --topic saga.replies --partitions 3 --replication-factor 1 --if-not-exists
        echo 'All topics created successfully'
      "
    networks:
      - msa-network

  # ========== Redis (공유 캐시) ==========
  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispw --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  redis-data:

networks:
  msa-network:
    driver: bridge
    name: msa-network
