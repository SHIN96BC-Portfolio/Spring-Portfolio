global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # msa-auth
  - job_name: 'msa-auth'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']

  # msa-platform services
  - job_name: 'msa-platform-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'  # edge-gateway
          - 'host.docker.internal:8081'  # user-bff
          - 'host.docker.internal:8082'  # admin-bff
          - 'host.docker.internal:8084'  # user-service
          - 'host.docker.internal:8085'  # commerce-service
          - 'host.docker.internal:8086'  # point-service
          - 'host.docker.internal:8087'  # fashion-service
          - 'host.docker.internal:8088'  # social-service
          - 'host.docker.internal:8089'  # recommendation-service
          - 'host.docker.internal:8090'  # activity-feed-service
          - 'host.docker.internal:8091'  # notification-service
          - 'host.docker.internal:8092'  # media-service
